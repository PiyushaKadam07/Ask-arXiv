<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask arXiv</title>
  <meta name="description" content="Ask a question about computer science research and get an answer that cites arXiv papers.">
  <style>
    :root {
      --bg: #faf9f7; --surface: #ffffff; --text: #1d1d1f; --muted: #5f6368;
      --border: #e3e1dc; --accent: #b31b1b; --accent-soft: #fbeaea; --focus: #1a73e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616; --surface: #202020; --text: #ececec; --muted: #a4a4a4;
        --border: #343434; --accent: #ff7b72; --accent-soft: #3a2222; --focus: #8ab4f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .lede { color: var(--muted); margin: 0 0 28px; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    }
    button {
      padding: 12px 20px; font: inherit; font-weight: 600; color: #fff;
      background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
    .examples button {
      font-size: 0.9rem; font-weight: 400; padding: 6px 12px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    }
    #result { margin-top: 32px; }
    .answer {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px;
    }
    .answer p { margin: 0; }
    .answer p + p { margin-top: 12px; }
    .cite { color: var(--accent); text-decoration: none; font-weight: 600; }
    .cite:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }
    h2 { font-size: 1rem; margin: 28px 0 10px; }
    ol { padding: 0; margin: 0; list-style: none; }
    li.source { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
    .num {
      flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      font-size: 0.85rem; font-weight: 700; background: var(--border);
    }
    li.cited .num { background: var(--accent-soft); color: var(--accent); }
    li.source a { color: var(--text); }
    .id { color: var(--muted); font-size: 0.85rem; }
    .error { color: var(--accent); }
    footer { color: var(--muted); font-size: 0.85rem; margin-top: 48px; }
    footer a { color: var(--muted); }
    @media (max-width: 520px) { form { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <h1>Ask <span>arXiv</span></h1>
  <p class="lede">Ask about computer science research. Answers come only from 20,000 arXiv papers and cite them.</p>

  <form id="ask">
    <input id="question" name="question" maxlength="300" required autocomplete="off"
           placeholder="e.g. How do graph neural networks handle over-smoothing?" aria-label="Your question">
    <button id="go" type="submit">Ask</button>
  </form>
  <ul class="examples" aria-label="Example questions">
    <li><button type="button">Can large language models write correct SQL queries?</button></li>
    <li><button type="button">How does differential privacy affect model accuracy?</button></li>
    <li><button type="button">How do robots learn to grasp new objects?</button></li>
  </ul>

  <section id="result" aria-live="polite"></section>

  <footer>
    Hybrid search (BM25 + embeddings) finds the papers, and Gemini writes the answer.
    <a href="https://github.com/PiyushaKadam07/Ask-arXiv">Source on GitHub</a>
  </footer>
</main>

<script>
  const form = document.getElementById("ask");
  const input = document.getElementById("question");
  const go = document.getElementById("go");
  const result = document.getElementById("result");

  const escape = (text) => text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // Turn [1] and [2, 4] into links that jump to the matching source below
  const linkCitations = (text) => escape(text).replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (match, nums) =>
    "[" + nums.split(/\s*,\s*/).map((n) => `<a class="cite" href="#source-${n}">${n}</a>`).join(", ") + "]");

  function show(data) {
    const heading = data.refused ? "Related papers" : "Sources";
    const sources = data.sources.map((s) => `
      <li class="source ${s.cited && !data.refused ? "cited" : ""}" id="source-${s.number}">
        <span class="num">${s.number}</span>
        <div><a href="${s.url}" target="_blank" rel="noopener">${escape(s.title)}</a>
        <div class="id">arXiv:${escape(s.id)}</div></div>
      </li>`).join("");
    result.innerHTML = `
      <div class="answer">
        ${data.answer.split(/\n\s*\n/).map((p) => `<p>${linkCitations(p)}</p>`).join("")}
        <div class="meta">Answered by ${escape(data.model || "no model")}</div>
      </div>
      ${data.sources.length ? `<h2>${heading}</h2><ol>${sources}</ol>` : ""}`;
  }

  async function ask(question) {
    go.disabled = true;
    go.textContent = "Thinking…";
    result.innerHTML = '<p class="meta">Searching 20,000 papers and writing an answer…</p>';
    try {
      const response = await fetch("ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Please ask a question between 3 and 300 characters.");
      show(data);
    } catch (err) {
      result.innerHTML = `<p class="error">${escape(err.message || "Something went wrong. Please try again.")}</p>`;
    } finally {
      go.disabled = false;
      go.textContent = "Ask";
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (input.value.trim()) ask(input.value.trim());
  });
  document.querySelectorAll(".examples button").forEach((button) =>
    button.addEventListener("click", () => { input.value = button.textContent; ask(button.textContent); }));
</script>
</body>
</html>
